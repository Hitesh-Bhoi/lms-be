services:
  backend:
    build:
      context: ./lms-be
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./lms-be/.env
    environment:
      - PORT=5000
      - NODE_ENV=production

  frontend:
    build:
      context: ./lms-fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: http://localhost:5000/api
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend
