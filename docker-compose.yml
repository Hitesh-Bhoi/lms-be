version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    env_file:
      - .env
    restart: always

  # Next.js Frontend service
  frontend:
    build:
      context: ../lms-fe          # Points to your local frontend folder
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_BASE_URL: http://localhost:5000/api
    ports:
      - 3000:3000
    depends_on:
      - backend
    restart: always
