services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: 
      redis: 
        condition: service_healthy
    restart: always

  # Redis service
  redis: 
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck: 
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # Next.js Frontend service
  frontend:
    build:
      context: ../lms-fe          # Points to your local frontend folder
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_BASE_URL: http://localhost:5000/api
    ports:
      - 3000:3000
    depends_on:
      - backend
    restart: always
